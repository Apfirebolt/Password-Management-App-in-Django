server {
    listen 80;
    server_name softgenie.org www.softgenie.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name softgenie.org www.softgenie.org;

    ssl_certificate /etc/letsencrypt/live/softgenie.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softgenie.org/privkey.pem;

    # Direct static file serving
    location /static/ {
        alias /home/Password-Management-App-in-Django/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Direct media file serving
    location /media/ {
        alias /home/Password-Management-App-in-Django/media/;
        expires 30d;
        access_log off;
    }

    # Proxy application traffic to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}